repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: check-history
        name: refuse commits from the rewritten pre-release history
        entry: scripts/check-history.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: make-check-fast
        name: make check-fast (format, vet, lint, tests; full gate runs at release)
        entry: make check-fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
